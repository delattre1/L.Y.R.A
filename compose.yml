# Copied from plow-agents/compose.example.yml, with AGENT_ID added for the
# leaderboard reporter.
services:
  agent:
    # The base image is pinned in the Dockerfile, which is the one place it
    # lives. To build against another: docker compose build --build-arg BASE_IMAGE=...
    build: .
    environment:
      # The ID the agent-index service registers on first run.
      AGENT_ID: lyra
      # How long a turn runs before she says she is still on it. The default is
      # 180, which is three times longer than a scam check takes, which is why
      # nobody ever saw one. Low enough to land inside a check, high enough not
      # to repeat during one: iMessage cannot edit a message, so every repeat is
      # a new one.
      HERMES_AGENT_NOTIFY_INTERVAL: "20"
    volumes:
      # `.host`: the image copies it into place as root, so the file's host ownership does not matter.
      - ./plow-credentials:/var/lib/plow/credentials.host:ro
      # The agent's home, kept across `up`/`down` for its sessions and setup.
      # `docker compose down -v` starts this agent fresh, and is what an edit
      # to SOUL.md needs before the agent sees it.
      - agent-home:/var/lib/hermes
    # The agent checkpoints on SIGTERM; its supervisor allows 30s, and Docker's default 10s cuts it off and orphans the transcript lease.
    stop_grace_period: 35s
    # No ports: the agent connects to Plow outbound.

volumes:
  agent-home:
